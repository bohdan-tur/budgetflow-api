[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "migrations",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
relative_files = true
source = [
    ".",
]
omit = [
    ".venv/*",
    "*/migrations/*",
    "tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true
